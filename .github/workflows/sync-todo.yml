name: sync-todo
on:
  push:
    branches: [dev]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make main available
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Update README TODO from main-to-dev diff
        run: python3 .github/workflows/sync_todo.py
      - name: Remove temporary workflow files
        run: rm -rf .github/workflows
      - name: Commit and push README update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update Complete TODO List for dev branch"
            git push origin HEAD:dev
          fi
